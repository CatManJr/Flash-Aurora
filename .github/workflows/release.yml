name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (CPU, no GPU required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies from official PyPI
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync --dev --python 3.12

      - name: Run full test suite
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv run --python 3.12 pytest -m "not integration" -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build --python 3.12

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '${PACKAGE_VERSION}'. Refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pyproject version ${PACKAGE_VERSION}."

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish --publish-url https://upload.pypi.org/legacy/
